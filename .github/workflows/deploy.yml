name: Deploy SpotLight AWS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SITE_URL: https://spotlight.rafaelcpires.abrdns.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::447580526253:role/SpotLightDeployPolicy
          aws-region: sa-east-1

      - name: Upload immutable assets
        run: |
          aws s3 sync ./dist/assets s3://spotlight-aws-frontend-rafael-447580526253-sa-east-1-an/assets \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload frontend
        run: |
          aws s3 sync ./dist s3://spotlight-aws-frontend-rafael-447580526253-sa-east-1-an \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E15HGE3E24J8GM \
            --paths "/*"
