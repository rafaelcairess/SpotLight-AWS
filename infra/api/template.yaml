AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Low-cost SpotLight ASP.NET Core API with an Aurora DSQL catalog

Parameters:
  StageName:
    Type: String
    Default: staging
    AllowedPattern: "^[a-z0-9-]+$"
  AllowedOrigin:
    Type: String
    Description: Exact frontend origin allowed by CORS
  SupabaseAuthIssuer:
    Type: String
    Description: HTTPS issuer used to validate the existing Supabase JWT
  SupabaseAuthAudience:
    Type: String
    Default: authenticated
Globals:
  Function:
    Runtime: dotnet10
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 15
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: Warning
      SystemLogLevel: Warning
    Environment:
      Variables:
        ASPNETCORE_ENVIRONMENT: Staging
        Cors__AllowedOrigins__0: !Ref AllowedOrigin
        SupabaseAuth__Issuer: !Ref SupabaseAuthIssuer
        SupabaseAuth__Audience: !Ref SupabaseAuthAudience
        Database__Provider: AuroraDsql
        Database__Required: "true"
        Database__AuroraDsqlEndpoint: !GetAtt CatalogCluster.Endpoint
        Database__AuroraDsqlUser: spotlight_api
        Database__AuroraDsqlOccMaxRetries: "3"

Resources:
  CatalogCluster:
    Type: AWS::DSQL::Cluster
    Properties:
      DeletionProtectionEnabled: false
      Tags:
        - Key: Project
          Value: SpotLight
        - Key: Environment
          Value: !Ref StageName
        - Key: Workload
          Value: catalog

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/spotlight-api-${StageName}"
      RetentionInDays: 7

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConnectToSpotLightCatalog
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConnectAsReadOnlyCatalogRole
                Effect: Allow
                Action: dsql:DbConnect
                Resource: !GetAtt CatalogCluster.ResourceArn

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: dotnet10
    Properties:
      FunctionName: !Sub "spotlight-api-${StageName}"
      CodeUri: ../../backend/SpotLight.Api/
      Handler: SpotLight.Api
      Role: !GetAtt ApiExecutionRole.Arn
      ReservedConcurrentExecutions: 2
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowHeaders:
            - Authorization
            - Content-Type
          AllowMethods:
            - GET
          MaxAge: 300

Outputs:
  ApiUrl:
    Description: Optional staging Function URL
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref ApiFunction
  ApiExecutionRoleArn:
    Description: Associate this IAM role with the spotlight_api DSQL role after the first deploy
    Value: !GetAtt ApiExecutionRole.Arn
  CatalogClusterIdentifier:
    Value: !Ref CatalogCluster
  CatalogClusterEndpoint:
    Value: !GetAtt CatalogCluster.Endpoint
