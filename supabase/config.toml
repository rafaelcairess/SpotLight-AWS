[auth]
site_url = "https://spotlight.rafaelcpires.abrdns.com"
additional_redirect_urls = [
  "https://spotlight.rafaelcpires.abrdns.com/",
  "https://spotlight.rafaelcpires.abrdns.com/?auth_mode=reset",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.steam-auth-start]
verify_jwt = false

[functions.steam-auth-callback]
verify_jwt = false

[functions.xbox-auth-start]
verify_jwt = false

[functions.xbox-auth-callback]
verify_jwt = false

[functions.psn-auth-start]
verify_jwt = false

[functions.psn-auth-callback]
verify_jwt = false

[functions.sync-steam-playtime]
verify_jwt = false

# User-facing functions rely on the gateway JWT check.
[functions.delete-account]
verify_jwt = true

[functions.fetch-steam-details]
verify_jwt = true

[functions.search-steam]
verify_jwt = true

# Internal jobs validate the service-role credential inside the handler.
[functions.send-price-alert-email]
verify_jwt = false

[functions.sync-xbox-library]
verify_jwt = false

[functions.sync-psn-trophies]
verify_jwt = false
